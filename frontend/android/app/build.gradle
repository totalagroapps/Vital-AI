apply plugin: 'com.android.application'

// Firma de release: variables de entorno (CI) o android/keystore.properties (local, no se sube a git).
// Sin ninguna de las dos, el APK de release sale sin firmar y no se puede instalar.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: keystoreProps.getProperty(propName)
}
def releaseStoreFile = signingValue('MIVOR_KEYSTORE_FILE', 'storeFile')
def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists()

android {
    namespace = "com.vitalai.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vitalai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI lo sube en cada build (MIVOR_VERSION_CODE) para que Android acepte la actualización
        versionCode((System.getenv('MIVOR_VERSION_CODE') ?: '3') as int)
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('MIVOR_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('MIVOR_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('MIVOR_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // R8: elimina código sin usar y ofusca; reglas propias en proguard-rules.pro
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.register('buildWebAssets', Exec) {
    workingDir file("${projectDir}/../../")
    ignoreExitValue true
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm run build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

tasks.register('cleanAndroidAssetsApk') {
    doLast {
        delete fileTree('src/main/assets/public') {
            include '**/*.apk'
        }
        delete file('src/main/assets/public/download')
    }
}

tasks.register('syncWebAssets', Copy) {
    dependsOn 'buildWebAssets'
    from('../../dist') {
        exclude 'download/**'
        exclude '**/*.apk'
    }
    into 'src/main/assets/public'
    doLast {
        delete fileTree('src/main/assets/public') {
            include '**/*.apk'
        }
        delete file('src/main/assets/public/download')
    }
}

tasks.register('copyApkToPublicDownload') {
    doLast {
        def debugApk = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        if (debugApk.exists()) {
            try {
                def publicTarget = file("${projectDir}/../../public/download/mivor-latest.apk")
                publicTarget.parentFile.mkdirs()
                java.nio.file.Files.copy(
                    debugApk.toPath(),
                    publicTarget.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                def backendTarget = file("${projectDir}/../../../backend/downloads/mivor-latest.apk")
                backendTarget.parentFile.mkdirs()
                java.nio.file.Files.copy(
                    debugApk.toPath(),
                    backendTarget.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                println ">>> [Auto-Copy APK] Copiado con éxito a public/download/mivor-latest.apk y backend/downloads/mivor-latest.apk <<<"
            } catch (Exception e) {
                println ">>> [Auto-Copy APK] Nota: " + e.getMessage()
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn 'cleanAndroidAssetsApk'
        task.dependsOn 'syncWebAssets'
    }
    // El lint de release (lintVital) también lee src/main/assets: debe ir después de copiar la web
    if (task.name.toLowerCase().contains('lintvital')) {
        task.dependsOn 'syncWebAssets'
    }
    if (task.name == 'assembleDebug' || task.name == 'packageDebug' || task.name == 'installDebug') {
        task.finalizedBy 'copyApkToPublicDownload'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
