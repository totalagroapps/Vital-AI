plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firma de release con la misma clave fija que la app MIVOR: variables de entorno (CI, secrets de
// GitHub) o keystore.properties local (no se sube a git). Sin ninguna, el release sale sin firmar.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: keystoreProps.getProperty(propName)
}
def releaseStoreFile = signingValue('MIVOR_KEYSTORE_FILE', 'storeFile')
def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists()

android {
    namespace 'ai.mivor.kiosk'
    compileSdk 36

    defaultConfig {
        applicationId "ai.mivor.kiosk"
        minSdk 24
        targetSdk 36
        // CI puede subirlo en cada build (KIOSK_VERSION_CODE) para que Android acepte la actualización
        versionCode((System.getenv('KIOSK_VERSION_CODE') ?: '4') as int)
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('MIVOR_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('MIVOR_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('MIVOR_KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
