name: Build Android APK

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build MIVOR.ai Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies & Build Web
        working-directory: frontend
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Make Gradlew Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android APK (Debug)
        working-directory: frontend/android
        run: ./gradlew clean assembleDebug --stacktrace --info --no-daemon

      - name: Prepare MIVOR Latest APK
        run: |
          mkdir -p frontend/public/download
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/public/download/mivor-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIVOR-Android-APK
          path: frontend/public/download/mivor-latest.apk
          retention-days: 30

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "MIVOR.ai Latest Build"
          body: "Descarga directa de la última versión compilada automáticamente de MIVOR.ai para Android."
          draft: false
          prerelease: false
          files: frontend/public/download/mivor-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
